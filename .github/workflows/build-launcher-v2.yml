name: Build FIRE BLAZE Launcher V2
on:
  push:
    branches: [ launcher-v2 ]
    paths:
      - 'launcher-v2-src/**'
      - '.github/workflows/build-launcher-v2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: launcher-v2-src
    steps:
      - uses: actions/checkout@v4
        with:
          ref: launcher-v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: launcher-v2.0.6
          name: FIRE BLAZE Launcher V2 v2.0.6
          body: Launcher V2 separado do Launcher antigo.
          files: launcher-v2-src/dist/FIRE-BLAZE-Launcher-V2-Setup-v2.0.6.exe
          make_latest: false
