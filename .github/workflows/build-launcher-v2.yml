name: Build FIRE BLAZE Launcher V2
on:
  push:
    branches: [ launcher-v2 ]
    paths:
      - 'launcher-v2-src/**'
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: launcher-v2-src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: FIRE-BLAZE-Launcher-V2
          path: launcher-v2-src/dist/*.exe
