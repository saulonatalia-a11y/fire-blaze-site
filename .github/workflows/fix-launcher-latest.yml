name: Fix Launcher Latest Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/fix-launcher-latest.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Mark Launcher 1.2.13 as repository latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit launcher-v1.2.13 --repo saulonatalia-a11y/fire-blaze-site --latest
