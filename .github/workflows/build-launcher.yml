name: Build FIRE BLAZE Launcher

on:
  push:
    branches: [ main ]
    paths:
      - 'launcher-src/**'
      - '.github/workflows/build-launcher.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: launcher-src
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate flame icon
        shell: pwsh
        run: |
          python -m pip install pillow
          @'
          from PIL import Image, ImageDraw
          img=Image.new("RGBA",(256,256),(0,0,0,0))
          d=ImageDraw.Draw(img)
          outer=[(128,18),(155,64),(151,91),(181,75),(193,111),(190,151),(174,188),(146,218),(111,229),(78,211),(58,178),(55,144),(69,108),(91,79),(103,49)]
          d.polygon(outer,fill=(255,76,20,255))
          inner=[(126,82),(143,111),(139,133),(157,124),(163,150),(154,181),(132,200),(106,195),(88,174),(88,149),(100,127),(112,110)]
          d.polygon(inner,fill=(255,190,40,255))
          core=[(124,128),(136,149),(132,165),(142,160),(143,177),(133,190),(117,189),(107,178),(108,162)]
          d.polygon(core,fill=(255,244,181,255))
          img.save("fire.ico",sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])
          '@ | Set-Content make_icon.py
          python make_icon.py

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer
        run: npm run dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: launcher-v1.2.17
          name: FIRE BLAZE Launcher v1.2.17
          body: |
            Instalador oficial do FIRE BLAZE Launcher/Painel.
            Faça login com a mesma conta usada no site.
          files: |
            launcher-src/dist/FIRE-BLAZE-Launcher-Setup-v1.2.17.exe
            launcher-src/dist/latest.yml
          make_latest: true
